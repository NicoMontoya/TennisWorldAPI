name = "tennisworld-api"
main = "src/index.js"
compatibility_date = "2026-05-03"
compatibility_flags = ["nodejs_compat"]

# ── Static Assets ──────────────────────────────────────────────────────────────
# Serves the frontend through the same Worker in production.
# wrangler dev will serve frontend/ at / and API at /api/*.
[assets]
directory = "../TennisWorldUI"
binding   = "ASSETS"

# ── KV Cache ───────────────────────────────────────────────────────────────────
# Create with: npx wrangler kv namespace create TENNIS_CACHE
# Then set the id below.
[[kv_namespaces]]
binding = "TENNIS_CACHE"
id      = "71f4016e2aa14b9c8bba916d05086fe1"

# ── D1 last-good store ─────────────────────────────────────────────────────────
# Nico creates the database and applies the migration. Do not invent an id.
#   npx wrangler d1 create tennisworld
#   paste the database_id below (replace the placeholder)
#   npx wrangler d1 migrations apply tennisworld --local
#   npx wrangler d1 migrations apply tennisworld --remote
# fixtures (tour, match_key) is the key a later picks table should reference.
[[d1_databases]]
binding = "DB"
database_name = "tennisworld"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ── Secrets ────────────────────────────────────────────────────────────────────
# Never commit real values. Set with:
#   npx wrangler secret put RAPIDAPI_KEY      # Scores live + Core MatchStat
#   npx wrangler secret put TENNIS_API_KEY    # leftover api-tennis.com routes
# For local dev, copy .dev.vars.example → .dev.vars (git-ignored).

# ── Vars (non-sensitive config) ────────────────────────────────────────────────
# ADMIN_SECRET is a secret, not a var: set with `npx wrangler secret put ADMIN_SECRET`
# (local dev value lives in .dev.vars). Admin routes fail closed when it is unset.
[vars]
CORS_ORIGIN  = "https://tennisworld-api.nicomontoya.workers.dev"  # prod origin; dev overridden via .dev.vars + localhost reflection
DEMO_MODE    = "false"                   # Set to "true" to serve mock data (no API key needed)
# Paid RapidAPI hard stop. Not toggleable from a route.
#   off   — never stop. Default ONLY when this var is unset.
#   on    — stop new RapidAPI calls once the monthly quota is exhausted
#   force — stop RapidAPI calls immediately
# Only those exact strings. A blank, typo, different case, or trailing space acts as on.
# Visitors then see cached/stale rankings, draws, and results; live scores
# stay on the last edge entry; uncached pages come back empty or 500 with a
# generic upstream error (no remaining count, reset, or stop flag).
RAPIDAPI_HARD_STOP = "on"
# API-Tennis.com (TENNIS_API_KEY) stop. Separate from RAPIDAPI_HARD_STOP.
# Same on/off/force strings. Unset defaults to on. A 429 trips it and is not retried.
# API_TENNIS_DAILY_CAP is the per-location UTC-day call cap while the stop is on.
API_TENNIS_HARD_STOP = "on"
API_TENNIS_DAILY_CAP = "100"
# Per-location UTC-day cap on RapidAPI calls while RAPIDAPI_HARD_STOP is on.
# Overage is billed per call (September 2026 was a $167 overage). The plan
# quota resets on the 16th of each month. 50/day stays inside a normal month.
# When the cap is hit, routes serve the last D1 copy and do not call RapidAPI
# again until the next UTC day. Unset uses the same default of 50.
# Backfill counts against this cap and against D1_DAILY_WRITE_BUDGET.
RAPIDAPI_DAILY_CALL_CAP = "50"
# Daily cap on D1 row upserts (live pulls and backfill). Unset uses 20000.
# 0 blocks new writes; reads of rows already stored still serve.
D1_DAILY_WRITE_BUDGET = "20000"
# Max rows one POST /api/admin/backfill-last-good call may write. Hard ceiling 200.
D1_BACKFILL_BATCH = "40"

# ── Scheduled cron triggers ────────────────────────────────────────────────────
# Rankings + calendar: refresh every 6 hours (data doesn't change often)
# Livescores: not here — live.js polls directly on the client side
[triggers]
crons = ["0 */6 * * *"]

# NOTE: deploys are top-level (`npx wrangler deploy`, no --env flag). The old
# [env.production] block never applied to actual deploys (they used top-level
# vars) and was removed as a misleading second source of truth.
